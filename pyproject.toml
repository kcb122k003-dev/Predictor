[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-predictor"
version = "0.1.0"
description = "Local, offline exam topic and question forecasting grounded in your syllabus, validated by time-aware backtesting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pillow>=10.0",
    "rapidfuzz>=3.5",
    "snowballstemmer>=2.2",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "plotly>=5.18",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "opencv-python-headless>=4.8"]
neural = ["sentence-transformers>=2.6"]
faiss = ["faiss-cpu>=1.7"]
dev = ["pytest>=7.4", "httpx>=0.25"]
all = [
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.8",
    "pytest>=7.4",
    "httpx>=0.25",
]

[project.scripts]
predictor = "predictor.cli:main"

[tool.setuptools.packages.find]
include = ["predictor*"]

[tool.setuptools.package-data]
predictor = ["config/*.toml", "config/*.json", "config/*.txt", "ui/static/*", "ui/static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ocr: requires the tesseract binary",
    "slow: longer end-to-end tests",
]
